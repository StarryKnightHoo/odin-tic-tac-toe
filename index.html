<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tac Tac Toe</title>
    <script src="script.js" defer></script>
    <link rel='stylesheet' href='styles.css'/>
</head>
<body>
    <div class="container">
        <div class="header">
            TIC-TAC-TOE
        </div>

        <div class="modal" id="modal">
            <div class="modal-body">
                <form id="form" action="" method="post">
                    <div class="player-one">
                        <label for="player-one">Player 1</label>
                        <input type="player-one" name="player-one" id="player-one" required>
                    </div>
                    <div class="player-two">
                        <label for="player-two">Player 2</label>
                        <input type="player-two" name="player-two" id="player-two" required>
                    </div>
                    <button class=submit type="submit">SUBMIT</button>
                </form>
            </div>
        </div>

        <div class="game">
            <div class="score">
                <div>Player 1: 0</div>
                <div>Player 2: 0</div>
            </div>

            <div class="turn">
                <div></div>
            </div>

            <div class="gameboard">
                <div class="tile tile-one"></div>
                <div class="tile tile-two"></div>
                <div class="tile tile-three"></div>
                <div class="tile tile-four"></div>
                <div class="tile tile-five"></div>
                <div class="tile tile-six"></div>
                <div class="tile tile-seven"></div>
                <div class="tile tile-eight"></div>
                <div class="tile tile-nine"></div>
            </div>

            <div class="restart">
                <button>NEW ROUND</button>
                <button>RESET</button>
            </div>
        </div>
    </div>
    <div class="display"></div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tac Tac Toe</title>
    <script src="script.js" defer></script>
    <link rel='stylesheet' href='styles.css'/>
</head>
<body>
    <div class="container">
        <div class="header">
            TIC-TAC-TOE
        </div>

        <div class="game">
            <div class="score">
                <div>Player 1: 0</div>
                <div>Player 2: 0</div>
            </div>

            <div class="turn">
                <div></div>
            </div>

            <div class="gameboard">
                <div class="tile tile-one"></div>
                <div class="tile tile-two"></div>
                <div class="tile tile-three"></div>
                <div class="tile tile-four"></div>
                <div class="tile tile-five"></div>
                <div class="tile tile-six"></div>
                <div class="tile tile-seven"></div>
                <div class="tile tile-eight"></div>
                <div class="tile tile-nine"></div>
            </div>

            <div class="restart">
                <button>NEW ROUND</button>
                <button>RESET</button>
            </div>
        </div>
    </div>
</body>
</html>

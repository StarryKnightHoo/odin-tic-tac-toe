<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tac Tac Toe</title>
    <script src="script.js" defer></script>
    <link rel='stylesheet' href='styles.css'/>
</head>
<body>
    <div class="container">
        <div class="header">
            TIC-TAC-TOE
        </div>

        <div class="modal" id="modal">
            <div class="modal-body">
                <form id="form" action="" method="post">
                    <div class="player-one">
                        <label for="player-one">Player 1</label>
                        <input type="player-one" name="player-one" id="player-one" required>
                    </div>
                    <div class="player-two">
                        <label for="player-two">Player 2</label>
                        <input type="player-two" name="player-two" id="player-two" required>
                    </div>
                    <button class=submit type="submit">SUBMIT</button>
                </form>
            </div>
        </div>

        <div class="game no-name-inputted">
            <div data-modal-target="#modal" class="score">
                <div class="score-container">
                    <div id="playerOne">Player 1</div>
                    <div>:</div>
                    <div id="player-one-score">0</div>
                </div>
                <div class="score-container">
                    <div id="playerTwo">Player 2</div>
                    <div>:</div>
                    <div id="player-two-score">0</div>
                </div>
            </div>

            <div class="turn">
                <div></div>
            </div>

            <div class="gameboard">
                <div class="tile tile-one" id="1"></div>
                <div class="tile tile-two" id="2"></div>
                <div class="tile tile-three" id="3"></div>
                <div class="tile tile-four" id="4"></div>
                <div class="tile tile-five" id="5"></div>
                <div class="tile tile-six" id="6"></div>
                <div class="tile tile-seven" id="7"></div>
                <div class="tile tile-eight" id="8"></div>
                <div class="tile tile-nine" id="9"></div>
            </div>

            <div class="restart">
                <button>RESET</button>
            </div>
        </div>
    </div>
    <div id="overlay"></div>
</body>
</html>
